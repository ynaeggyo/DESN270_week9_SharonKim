<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cat Memes Showcase</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        main div {
            width: 200px;
            height: 200px;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        main div:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>🐱 Trending Cat Memes 🐱</h1>

    <main></main>

    <script>
        $(document).ready(function() {
            
            const apiKey = "iOoUwjBnNMlKVPkWcoWvsg6yz7dgx8HV"; 

            function loadCatMemes() {
                let url = `https://api.giphy.com/v1/gifs/search?api_key=${apiKey}&q=cat+meme&limit=30&offset=0&rating=g&lang=en`;

                $.getJSON(url, function(json) {
                    $("main").empty();

                    for (let i = 0; i < json.data.length; i++) {
                        let imageUrl = json.data[i].images.downsized_large.url;
                        
                        $("main").append(`<div style="background-image: url('${imageUrl}');"></div>`);
                    }
                });
            }

            loadCatMemes();

        });
    </script>
</body>
</html>
