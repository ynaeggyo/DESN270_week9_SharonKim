<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAT OF THE DAY — Trendy Archive</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #111111;
            color: #ffffff;
            padding: 40px 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        .sub-header {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #cccccc;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 6.5rem);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 0.95;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .ticker {
            font-size: 15px;
            font-weight: 600;
            border-top: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
            padding: 12px 0;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .meme-card {
            width: calc(33.333% - 14px);
            height: 300px;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            border-radius: 16px;
            transition: transform 0.3s ease;
        }

        .meme-card:hover {
            transform: translateY(-6px);
        }

        @media (max-width: 900px) {
            .meme-card {
                width: calc(50% - 10px);
            }
        }

        @media (max-width: 600px) {
            .meme-card {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="sub-header">— Live Giphy API Showcase —</div>
        <h1>CAT OF THE DAY</h1>
        <div class="ticker">
            <span>Trending Archive</span> — 
            <span>Real-Cat</span> — 
            <span>Cute Memes</span>
        </div>
    </header>

    <main></main>

    <script>
        $(document).ready(function() {
            
            const apiKey = "Dj7YdNGQ7PdVGGV3XTzzI51ZWoY1eYQR"; 
            
            // 보내준 링크 5개의 고유 ID 리스트
            const catIds = [
                "GK7dGndK4kyOozR9Xk",
                "ytu2GUYbvhz7zShGwS",
                "A0Zt7yuDULiy4ofmVD",
                "pY8jLmZw0ElqvVeRH4",
                "vK1p6B4hV6MhGNC2co"
            ];

            function fetchSelectedCatMemes() {
                $("main").empty();

                const idsString = catIds.join(",");
                const url = `https://api.giphy.com/v1/gifs?api_key=${apiKey}&ids=${idsString}`;

                $.getJSON(url, function(json) {
                    if (json.data && json.data.length > 0) {
                        json.data.forEach(item => {
                            let imageUrl = item.images.fixed_height.url;
                            $("main").append(`<div class="meme-card" style="background-image: url('${imageUrl}');"></div>`);
                        });
                    }
                }).fail(function(jqXHR, textStatus, errorThrown) {
                    console.error("API 요청 실패:", textStatus, errorThrown);
                });
            }

            fetchSelectedCatMemes();

        });
    </script>
</body>
</html>
