<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAT OF THE DAY — Trendy Archive</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7f6f0;
            color: #111111;
            padding: 40px 20px;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        .sub-header {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #666666;
            transition: color 0.4s ease;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 6.5rem);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 0.95;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .ticker {
            font-size: 15px;
            font-weight: 600;
            border-top: 1px solid #111111;
            border-bottom: 1px solid #111111;
            padding: 12px 0;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            transition: border-color 0.4s ease;
        }

        .controls {
            text-align: center;
            margin-bottom: 40px;
        }

        .vibe-btn {
            background-color: #111111;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 40px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.4s ease, color 0.4s ease;
        }

        .vibe-btn:hover {
            transform: scale(1.03);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .meme-card {
            width: calc(33.333% - 14px);
            height: 320px;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            border-radius: 16px;
            transition: transform 0.3s ease;
        }

        .meme-card:hover {
            transform: translateY(-6px);
        }

        @media (max-width: 900px) {
            .meme-card {
                width: calc(50% - 10px);
            }
        }

        @media (max-width: 600px) {
            .meme-card {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="sub-header">— Live Giphy API Showcase —</div>
        <h1>CAT OF THE DAY</h1>
        <div class="ticker">
            <span>Trending Archive</span> — 
            <span>Score 9.85</span> — 
            <span>Updated Real-Time</span> — 
            <span>Curated Memes</span>
        </div>
        <div class="controls">
            <button class="vibe-btn" id="vibeBtn">Change Palette</button>
        </div>
    </header>

    <main></main>

    <script>
        $(document).ready(function() {
            
            const apiKey = "iOoUwjBnNMlKVPkWcoWvsg6yz7dgx8HV"; 

            function fetchCatMemes() {
                let url = `https://api.giphy.com/v1/gifs/search?api_key=${apiKey}&q=cat+meme&limit=27&offset=0&rating=g&lang=en`;

                $.getJSON(url, function(json) {
                    $("main").empty();
                    for (let i = 0; i < json.data.length; i++) {
                        let imageUrl = json.data[i].images.downsized_large.url;
                        $("main").append(`<div class="meme-card" style="background-image: url('${imageUrl}');"></div>`);
                    }
                });
            }

            fetchCatMemes();

            // 교수님 피드백 반영: 팔레트 색상이 순서대로 쌓이며 바뀌고 다시 초기화되지 않는 기능
            const themes = [
                { bg: "#e5ebd9", text: "#1b3022", btnBg: "#1b3022", btnText: "#e5ebd9" },
                { bg: "#fceade", text: "#4a2810", btnBg: "#4a2810", btnText: "#fceade" },
                { bg: "#e3edf7", text: "#0f2c59", btnBg: "#0f2c59", btnText: "#e3edf7" },
                { bg: "#f4effa", text: "#2d124d", btnBg: "#2d124d", btnText: "#f4effa" },
                { bg: "#111111", text: "#f7f6f0", btnBg: "#f7f6f0", btnText: "#111111" }
            ];
            
            let themeIndex = 0;

            $("#vibeBtn").click(function() {
                let currentTheme = themes[themeIndex % themes.length];
                
                $("body").css({
                    "background-color": currentTheme.bg,
                    "color": currentTheme.text
                });
                $(".sub-header").css("color", currentTheme.text);
                $(".ticker").css("border-color", currentTheme.text);
                $(".vibe-btn").css({
                    "background-color": currentTheme.btnBg,
                    "color": currentTheme.btnText
                });

                themeIndex++;
            });

        });
    </script>
</body>
</html>
