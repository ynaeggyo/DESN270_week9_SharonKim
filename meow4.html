<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAT OF THE DAY — Trendy Archive</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #111111;
            color: #ffffff;
            padding: 40px 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        .sub-header {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #cccccc;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 6.5rem);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 0.95;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .ticker {
            font-size: 15px;
            font-weight: 600;
            border-top: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
            padding: 12px 0;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .meme-card {
            width: calc(33.333% - 14px);
            height: 300px;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            border-radius: 16px;
            transition: transform 0.3s ease;
        }

        .meme-card:hover {
            transform: translateY(-6px);
        }

        @media (max-width: 900px) {
            .meme-card {
                width: calc(50% - 10px);
            }
        }

        @media (max-width: 600px) {
            .meme-card {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="sub-header">— Live Giphy API Showcase —</div>
        <h1>CAT OF THE DAY</h1>
        <div class="ticker">
            <span>Trending Archive</span> — 
            <span>Real-Cat</span> — 
            <span>Cute Memes</span>
        </div>
    </header>

    <main></main>

    <script>
        $(document).ready(function() {
            
            // Giphy API를 통해 가져온 검증된 레전드 고양이 밈 5개의 다이렉트 이미지 URL 리스트
            const catImages = [
                "https://media4.giphy.com/media/L0q28v91Z9Rtu/giphy.gif",
                "https://media3.giphy.com/media/ICOgILNqC999e/giphy.gif",
                "https://media1.giphy.com/media/GeimhxWv73sQ8/giphy.gif",
                "https://media2.giphy.com/media/Jq89aTUPu9B8A/giphy.gif",
                "https://media0.giphy.com/media/W5YxsZxhZRdfG/giphy.gif"
            ];

            function renderCatMemes() {
                $("main").empty();
                catImages.forEach(url => {
                    $("main").append(`<div class="meme-card" style="background-image: url('${url}');"></div>`);
                });
            }

            renderCatMemes();

        });
    </script>
</body>
</html>
