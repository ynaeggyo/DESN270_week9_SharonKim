<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sharon's Clock</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding-top: 100px;
        }

        h1 {
            color: black;
        }

        #clock {
            font-size: 50px;
            color: blue;
        }
    </style>
</head>

<body>

    <!-- Title -->
    <h1>Sharon's Clock</h1>

    <!-- Description above the clock -->
    <p>This digital clock displays the current time and updates every second.</p>

    <div id="clock">00:00:00</div>

    <!-- Description below the clock -->
    <p>
        The clock is normally blue. At the beginning of each minute,
        the text briefly changes to white and then returns to blue.
    </p>

    <script>
        // Function to display the current time
        function displayTimeFunction() {
            const now = new Date();

            let hours = String(now.getHours()).padStart(2, "0");
            let minutes = String(now.getMinutes()).padStart(2, "0");
            let seconds = String(now.getSeconds()).padStart(2, "0");

            // Display the time using jQuery
            $("#clock").text(hours + ":" + minutes + ":" + seconds);

            // Change the text to white briefly at the beginning of each minute
            if (seconds === "00") {
                $("#clock").css("color", "white");

                setTimeout(function () {
                    $("#clock").css("color", "blue");
                }, 1000);
            }
        }

        // Display the time immediately and update it every second
        displayTimeFunction();
        setInterval(displayTimeFunction, 1000);
    </script>

</body>
</html>
