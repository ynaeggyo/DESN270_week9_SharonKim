<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sharon's Clock</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding-top: 100px;
        }

        h1 {
            color: black;
        }

        #clock {
            font-size: 50px;
            color: black;
        }
    </style>
</head>

<body>

    <h1>Sharon's Clock</h1>

    <p>The color of the clock changes every minute..</p>

    <div id="clock">00:00:00</div>


    <script>
        function displayTimeFunction() {
            const now = new Date();

            let hours = String(now.getHours()).padStart(2, "0");
            let minutes = String(now.getMinutes()).padStart(2, "0");
            let seconds = String(now.getSeconds()).padStart(2, "0");

            $("#clock").text(hours + ":" + minutes + ":" + seconds);

            // Change the clock to white briefly at the beginning of each minute
            if (seconds === "00") {
                $("#clock").css("color", "white");

                setTimeout(function () {
                    $("#clock").css("color", "black");
                }, 1000);
            }
        }

        displayTimeFunction();
        setInterval(displayTimeFunction, 1000);
    </script>

</body>
</html>
